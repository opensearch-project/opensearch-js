name: Coverage

# trigger on every commit push and PR for all branches
on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
jobs:
  code-coverage:
    name: Code coverage
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [12.x]

    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: ${{ matrix.node-version }}

      # NPM started understanding yarn.lock file starting from v7
      - name: Update NPM
        shell: bash
        run: |
          export NPM_VERSION=$(npm -v)
          export IS_NPM_SUITABLE=$(node -p "parseInt(process.env.NPM_ROOT, 10) >= 7")
          if [ "$IS_NPM_SUITABLE" == "false" ]; then
            echo "NPM needs upgrading!"
            npm i npm@7 -g
          fi

      - name: Install
        run: |
          npm install
      - name: Code coverage report
        run: |
          npm run test:coverage-report
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage.lcov
          fail_ci_if_error: false

      - name: Code coverage 90%
        run: |
          npm run test:coverage-90
