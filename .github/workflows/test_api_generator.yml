name: Test API Generator
on:
  pull_request:
    paths:
      - 'api_generator/**'
      - '.github/workflows/test_api_generator.yml'
  push:
    branches:
      - main
    paths:
      - 'api_generator/**'
      - '.github/workflows/test_api_generator.yml'
jobs:
  test-api-generator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api_generator
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Test API Generator
        run: npm test
